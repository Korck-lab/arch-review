id: t003-reports-export-d1
difficulty: easy
source:
  kind: synthetic
defects:
- id: d1
  category: traversal
  file: reports/export.py
  lines:
  - 1
  - 16
  summary: 'path traversal: caller-controlled filename joined onto EXPORT_DIR'
  rationale: 'export_report joins the caller-supplied user and filename straight onto EXPORT_DIR
    and creates the parent directory. A filename of "../../../../etc/cron.d/x" or a user of
    ".." escapes the export root and writes or creates directories outside /srv/reports/exports.
    A senior reviewer would resolve the target and assert it stays inside EXPORT_DIR, and
    reject names containing path separators or leading dots.

    '
distractors:
- id: x1
  file: reports/export.py
  lines:
  - 21
  - 21
  concern: write_text is not atomic, so a crash or a concurrent reader can see a truncated
    CSV at the target path
  why_ok: 'The URL is returned only after write_text returns, so the file is complete before
    it is advertised. The diff establishes no concurrent reader of the same path: nothing
    in the supplied material serves or reads /exports/... while the write is in progress.
    A crash mid-write leaves a partial file at a path that was never advertised for that export,
    and the next export of the same name overwrites it. The concern needs a reader the material
    does not establish, so it is speculative, not a defect.

    '
prompt_notes: 'PR description says: self-service CSV export'
