id: t001-payment-race-d1
difficulty: easy
source:
  kind: synthetic
defects:
- id: d1
  category: contracts
  file: billing/charge.py
  lines:
  - 25
  - 27
  summary: 'new balance pre-check is defective: it rejects valid card payments and is a non-atomic
    check-then-act'
  rationale: "The pre-check is the PR's main change and a reviewer reads it twice: it gates\
    \ checkout on a balance that is not the funding source, and it does so non-atomically.\
    \ The context states checkout charges the card on file and debits the internal balance\
    \ ledger: the card is the funding source, the ledger only records the debit. Raising ValueError\
    \ when the ledger balance is below the amount refuses a customer with a valid card and\
    \ a low ledger balance where the same call used to succeed \u2014 a behavior change contradicting\
    \ the PR's claim of no behavior change \u2014 and it reuses ValueError, so callers cannot\
    \ tell it from the amount check. Separately, get_balance and the later debit are separate\
    \ calls with no reservation, so two concurrent checkouts can both pass the check and both\
    \ debit: the fast-fail guard is a check-then-act race. All three symptoms are one mechanism,\
    \ the balance pre-check. A reviewer would not gate payment on the ledger balance, or would\
    \ document the new rejection contract, and would make any gate atomic with the debit.\n"
distractors:
- id: x1
  file: billing/charge.py
  lines:
  - 25
  - 25
  concern: the pre-check and retry backoff add latency to the checkout path
  why_ok: 'A successful checkout adds one local balance read and no sleep; the retry backoff
    runs only after a GatewayError, the exceptional path, and is bounded at 0.3s total. An
    insufficient-funds checkout is rejected before the card call, the slowest round trip,
    so the check makes the common failure case faster. The PR''s latency claim concerns the
    success path, which gains one local read.

    '
prompt_notes: 'PR description says: improves checkout performance'
