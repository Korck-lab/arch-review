id: t005-notify-queue
difficulty: hard
source:
  kind: synthetic
defects:
  - id: d1
    category: resilience
    file: notify/sender.py
    lines: [10, 16]
    summary: "retry without idempotency can send the same email twice"
    rationale: >
      provider.send takes no idempotency key. If a delivery succeeds but the
      response is lost (a timeout after the provider commits), the retry loop
      calls send again and the customer gets the email twice. The PR claims
      "without sending anything twice", but the loop has no deduplication. A
      reviewer would derive an idempotency key from the email id and let the
      provider dedupe replays.
  - id: d2
    category: data
    file: notify/queue.py
    lines: [8, 14]
    summary: "new kind filter scans the hot queue table without a supporting index"
    rationale: >
      claim_batch adds WHERE kind = %s AND claimed_by IS NULL to the pickup
      query, but the outbound table has indexes only on (id) and (claimed_by);
      there is no index on (kind). Every worker pickup now scans by kind on the
      hottest query in the system, so claim latency grows with the table. A
      reviewer would add an index on (kind, enqueued_at), partial on
      claimed_by IS NULL, which supports both the filter and the ORDER BY.
  - id: d3
    category: contracts
    file: notify/queue.py
    lines: [6, 6]
    summary: "required kind parameter inserted mid-signature; no caller updated"
    rationale: >
      claim_batch(worker_id, limit) becomes claim_batch(worker_id, kind, limit).
      The new parameter is required and sits in the middle, so an existing
      caller writing claim_batch(worker, 50) now binds 50 to kind and raises
      TypeError for the missing limit. A caller passing three values by
      accident would bind them silently. The diff updates no caller. A reviewer
      would append kind as a keyword argument with a default, or update every
      call site in the same change.
distractors:
  - id: x1
    file: notify/queue.py
    lines: [15, 25]
    concern: "claim-then-update is a check-then-act race between workers"
    why_ok: >
      The UPDATE is conditional — WHERE id = %s AND claimed_by IS NULL — and
      only rows whose UPDATE matched (rowcount > 0) are returned. If two
      workers SELECT the same email, the second UPDATE matches zero rows and
      that worker drops it, so exactly one worker claims each email. The
      guarded UPDATE plus the rowcount check is the safety. This settles worker
      contention only; it says nothing about how many times the claiming worker
      then calls the provider.
  - id: x2
    file: notify/queue.py
    lines: [22, 25]
    concern: "the rowcount filter can return fewer rows than the requested limit"
    why_ok: >
      A row whose conditional UPDATE matched nothing is dropped from the
      returned batch, so a contended pass hands the caller a short batch. That
      row keeps claimed_by IS NULL, so the next pickup selects it again and
      another worker sends it. A short batch costs one cycle of latency; no
      email is dropped.
  - id: x3
    file: notify/sender.py
    lines: [9, 14]
    concern: "the retry backoff blocks the worker with time.sleep"
    why_ok: >
      The sleep runs only after provider.send raises TransientError, the
      failure path, and is bounded: 0.2s then 0.4s, at most 0.6s before the
      third attempt raises. A worker whose provider degrades backs off briefly
      and gives up; it does not stall. Bounded retry backoff is not a defect.
  - id: x4
    file: notify/queue.py
    lines: [17, 22]
    concern: "db.execute(...).rowcount assumes a cursor return the diff never shows"
    why_ok: >
      The context states notify.db's execute returns a cursor-like object
      whose rowcount is the number of affected rows. The pre-diff caller
      ignored the return, but the type is part of the documented store
      contract, so reading .rowcount is safe.
prompt_notes: "PR description says: more robust delivery"
