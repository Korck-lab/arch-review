id: t003-reports-export
difficulty: medium
source:
  kind: synthetic
defects:
  - id: d1
    category: traversal
    file: reports/export.py
    lines: [12, 13]
    summary: "path traversal: caller-controlled filename joined onto EXPORT_DIR"
    rationale: >
      export_report joins the caller-supplied user and filename straight onto
      EXPORT_DIR and creates the parent directory. A filename of
      "../../../../etc/cron.d/x" or a user of ".." escapes the export root and
      writes or creates directories outside /srv/reports/exports. A senior
      reviewer would resolve the target and assert it stays inside EXPORT_DIR,
      and reject names containing path separators or leading dots.
  - id: d2
    category: resilience
    file: reports/storage.py
    lines: [31, 32]
    summary: "blob fetch's retry misses the transient failures it claims to cover: the timeout is gone and mid-read drops are not caught"
    rationale: >
      The PR claims the read is now "retried for transient network errors", but
      two transient cases defeat the new retry. _read calls urlopen(url) with
      no timeout — the previous timeout=10 is gone — so a hung blob service
      blocks the worker forever and the TimeoutError retry branch is dead code.
      And the retry catches only URLError and TimeoutError: a connection that
      drops mid-body raises http.client.IncompleteRead (or RemoteDisconnected),
      which neither catch covers, so it escapes on the first attempt. Both
      symptoms are one mechanism: the new retry wrapper does not cover the
      transient cases it claims. A reviewer would restore the bounded timeout
      and catch the read-time failures urlopen can raise.
distractors:
  - id: x1
    file: reports/storage.py
    lines: [16, 27]
    concern: "retry loop could mask a real failure"
    why_ok: >
      Only transient failures are retried: transport URLErrors, direct timeouts
      (TimeoutError), and retryable HTTP statuses (408, 429, 500, 502, 503, 504).
      Permanent HTTP statuses are re-raised immediately, and the last attempt
      re-raises anything else, so a genuine failure still surfaces loudly. The
      request is an idempotent GET, so a retried read cannot corrupt state, and
      the backoff is bounded at three attempts. The retry cannot swallow a real
      failure; its incomplete coverage is d2, not this concern.
  - id: x2
    file: reports/export.py
    lines: [21, 21]
    concern: "write_text is not atomic, so a crash or a concurrent reader can see a truncated CSV at the target path"
    why_ok: >
      The URL is returned only after write_text returns, so the file is
      complete before it is advertised. The diff establishes no concurrent
      reader of the same path: nothing in the supplied material serves or reads
      /exports/... while the write is in progress. A crash mid-write leaves a
      partial file at a path that was never advertised for that export, and the
      next export of the same name overwrites it. The concern needs a reader
      the material does not establish, so it is speculative, not a defect.
prompt_notes: "PR description says: self-service CSV export"
