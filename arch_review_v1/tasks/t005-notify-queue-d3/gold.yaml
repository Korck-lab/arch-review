id: t005-notify-queue-d3
difficulty: easy
source:
  kind: synthetic
defects:
- id: d1
  category: contracts
  file: notify/queue.py
  lines:
  - 4
  - 5
  summary: required kind parameter inserted mid-signature; no caller updated
  rationale: 'claim_batch(worker_id, limit) becomes claim_batch(worker_id, kind, limit). The
    new parameter is required and sits in the middle, so an existing caller writing claim_batch(worker,
    50) now binds 50 to kind and raises TypeError for the missing limit. A caller passing
    three values by accident would bind them silently. The diff updates no caller. A reviewer
    would append kind as a keyword argument with a default, or update every call site in the
    same change.

    '
distractors:
- id: x1
  file: notify/queue.py
  lines:
  - 15
  - 25
  concern: claim-then-update is a check-then-act race between workers
  why_ok: "The UPDATE is conditional \u2014 WHERE id = %s AND claimed_by IS NULL \u2014 and\
    \ only rows whose UPDATE matched (rowcount > 0) are returned. If two workers SELECT the\
    \ same email, the second UPDATE matches zero rows and that worker drops it, so exactly\
    \ one worker claims each email. The guarded UPDATE plus the rowcount check is the safety.\
    \ This settles worker contention only; it says nothing about how many times the claiming\
    \ worker then calls the provider.\n"
prompt_notes: 'PR description says: more robust delivery'
