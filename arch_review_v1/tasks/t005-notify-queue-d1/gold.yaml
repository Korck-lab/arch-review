id: t005-notify-queue-d1
difficulty: easy
source:
  kind: synthetic
defects:
- id: d1
  category: resilience
  file: notify/sender.py
  lines:
  - 4
  - 16
  summary: retry without idempotency can send the same email twice
  rationale: 'provider.send takes no idempotency key. If a delivery succeeds but the response
    is lost (a timeout after the provider commits), the retry loop calls send again and the
    customer gets the email twice. The PR claims "without sending anything twice", but the
    loop has no deduplication. A reviewer would derive an idempotency key from the email id
    and let the provider dedupe replays.

    '
distractors:
- id: x1
  file: notify/sender.py
  lines:
  - 9
  - 14
  concern: the retry backoff blocks the worker with time.sleep
  why_ok: 'The sleep runs only after provider.send raises TransientError, the failure path,
    and is bounded: 0.2s then 0.4s, at most 0.6s before the third attempt raises. A worker
    whose provider degrades backs off briefly and gives up; it does not stall. Bounded retry
    backoff is not a defect.

    '
prompt_notes: 'PR description says: more robust delivery'
