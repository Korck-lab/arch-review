id: t004-warehouse-sync
difficulty: hard
source:
  kind: synthetic
defects:
  - id: d1
    category: architecture
    file: warehouse/app.py
    lines: [6, 6]
    summary: "new import closes a circular dependency between app and sync"
    rationale: >
      The PR adds from warehouse.sync import request_sync to app.py. sync.py
      already does from warehouse.app import get_db. Importing app now loads
      sync, which loads app again: a cycle. At runtime this surfaces as
      partially-initialized modules, import-order breakage, or None attributes
      on not-yet-set module state. A reviewer would move get_db into
      warehouse.store (or a shared module) so sync never imports app.
  - id: d2
    category: operability
    file: warehouse/sync.py
    lines: [11, 11]
    summary: "sync interval pinned in code; the environment override is gone"
    rationale: >
      The job used to read SYNC_INTERVAL_SECONDS from the environment. The PR
      hardcodes SYNC_INTERVAL_SECONDS = 3600 and drops the env read.
      run_forever consumes the constant, but operators can no longer tune the
      interval without a code deploy, and the constant silently ignores any
      operator configuration. Config belongs outside the source tree.
  - id: d3
    category: resilience
    file: warehouse/sync.py
    lines: [26, 33]
    summary: "an unhandled hub error propagates out of run_forever and kills the scheduler"
    rationale: >
      _push calls urllib.request.urlopen with no try/except. A single hub 5xx,
      timeout, or DNS failure raises URLError. Nothing catches it in
      sync_inventory, _drain_jobs, or run_forever, so the exception escapes the
      while True loop and the scheduler process exits. Every later sync stops,
      and the queued job rows are never marked processed. A reviewer would ask
      for a per-delta try/except that logs and continues, so one bad delta
      cannot take the whole job down.
distractors:
  - id: x1
    file: warehouse/sync.py
    lines: [27, 27]
    concern: "blocking sleep inside the sync loop stalls the job"
    why_ok: >
      sync_inventory runs only in the scheduler loop (run_forever); the request
      path (request_sync) inserts one job row and returns immediately, so the
      sleep never runs inside a request. The sleep is a deliberate hub rate
      limit, not a bug.
  - id: x2
    file: warehouse/sync.py
    lines: [37, 45]
    concern: "_drain_jobs re-pushes the same deltas once per queued job"
    why_ok: >
      _drain_jobs calls sync_inventory() for every unprocessed job, so N queued
      jobs push the same pending deltas N times. The hub is idempotent by delta
      id, so a repeated push applies the delta once and the inventory stays
      correct. The repetition wastes hub calls but cannot corrupt state.
prompt_notes: "PR description says: decouple the sync job from the web app"
