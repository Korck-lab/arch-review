[project]
name = "arch-review-v1"
description = "Architectural code review eval environment for the Prime Intellect Environments Hub"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["arch_review_v1/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.verifiers.eval]
num_examples = 3
rollouts_per_example = 1

[tool.mypy]
ignore_missing_imports = true
